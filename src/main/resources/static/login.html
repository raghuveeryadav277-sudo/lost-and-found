<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login - Lost &amp; Found</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="/css/app.css" rel="stylesheet">
</head>
<body>
<div id="app-navbar"></div>

<div class="container">
  <div class="card auth-card shadow-sm">
    <div class="card-body p-4">
      <h3 class="card-title text-center mb-1">Welcome back</h3>
      <p class="text-center text-muted mb-4">Login with your campus account</p>
      <div id="msg"></div>
      <!-- Spring Security form login: POST /login with email + password -->
      <form method="post" action="/login">
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" name="email" class="form-control" placeholder="you@campus.edu" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" name="password" class="form-control" placeholder="Your password" required>
        </div>
        <button type="submit" class="btn btn-brand w-100">Login</button>
      </form>
      <p class="text-center mt-3 mb-0">New here? <a href="/register.html">Create an account</a></p>
      <hr>
      <p class="text-muted mb-0" style="font-size:.85rem">
        Demo logins: <code>aarav@campus.edu / student123</code>,
        <code>meera@campus.edu / student123</code>,
        <code>admin@campus.edu / admin123</code>
      </p>
    </div>
  </div>
</div>

<div id="app-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/app.js"></script>
<script>
(async () => {
  await renderNavbar("");
  pageFooter();
  const q = new URLSearchParams(location.search);
  const msg = document.getElementById("msg");
  if (q.has("error")) msg.innerHTML = '<div class="alert alert-danger">Wrong email or password. Please try again.</div>';
  if (q.has("logout")) msg.innerHTML = '<div class="alert alert-success">You have been logged out.</div>';
})();
</script>
</body>
</html>
