<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Reports - Lost &amp; Found</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="/css/app.css" rel="stylesheet">
</head>
<body>
<div id="app-navbar"></div>

<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2 class="mb-0">My reports</h2>
    <a href="/report.html" class="btn btn-brand">+ New report</a>
  </div>
  <div id="msg"></div>
  <div class="row" id="list"><p class="text-muted">Loading...</p></div>
</div>

<div id="app-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/app.js"></script>
<script>
(async () => {
  await renderNavbar("myreports");
  pageFooter();
  if (!requireAuth()) return;

  async function load() {
    const items = await apiGet("/api/my/items");
    document.getElementById("list").innerHTML = items.length
      ? items.map(i => itemCard(i,
          i.status === "OPEN"
            ? `<button class="btn btn-outline-secondary btn-sm close-btn" data-id="${i.itemId}">Close case</button>`
            : "")).join("")
      : '<p class="text-muted">You have not reported anything yet.</p>';
    document.querySelectorAll(".close-btn").forEach(btn =>
      btn.addEventListener("click", async () => {
        if (!confirm("Close this case?")) return;
        try { await apiPost("/api/items/" + btn.dataset.id + "/close"); load(); }
        catch (e) { alert(e.message); }
      }));
  }
  load();
})();
</script>
</body>
</html>
