<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notifications - Lost &amp; Found</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="/css/app.css" rel="stylesheet">
</head>
<body>
<div id="app-navbar"></div>

<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2 class="mb-0">Notifications</h2>
    <button id="read-all" class="btn btn-outline-primary btn-sm">Mark all as read</button>
  </div>
  <div id="list"><p class="text-muted">Loading...</p></div>
</div>

<div id="app-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/app.js"></script>
<script>
(async () => {
  await renderNavbar("notifications");
  pageFooter();
  if (!requireAuth()) return;

  async function load() {
    const list = await apiGet("/api/notifications");
    document.getElementById("list").innerHTML = list.length
      ? list.map(n => `
        <div class="card mb-2 ${n.read ? "" : "notif-unread"}">
          <div class="card-body py-2 d-flex justify-content-between align-items-center">
            <div>
              <div>${esc(n.message)}</div>
              <small class="text-muted">${fmtDate(n.createdAt)}</small>
            </div>
            ${n.read ? "" : `<button class="btn btn-sm btn-outline-secondary mark-btn" data-id="${n.notificationId}">Mark read</button>`}
          </div>
        </div>`).join("")
      : '<p class="text-muted">No notifications yet. You will be alerted about matches, claims and returns here.</p>';
    document.querySelectorAll(".mark-btn").forEach(b => b.addEventListener("click", async () => {
      await apiPost("/api/notifications/" + b.dataset.id + "/read"); load();
    }));
  }
  document.getElementById("read-all").addEventListener("click", async () => {
    await apiPost("/api/notifications/read-all"); load();
  });
  load();
})();
</script>
</body>
</html>
