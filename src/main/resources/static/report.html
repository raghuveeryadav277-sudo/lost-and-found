<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Report Item - Lost &amp; Found</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="/css/app.css" rel="stylesheet">
</head>
<body>
<div id="app-navbar"></div>

<div class="container mt-4">
  <h2 class="mb-1">Report an item</h2>
  <p class="text-muted mb-4">Lost something, or found something? File a report - the system will immediately look for matches.</p>
  <div id="msg"></div>
  <div class="card shadow-sm">
    <div class="card-body p-4">
      <form id="report-form">
        <div class="mb-3">
          <label class="form-label d-block">Report type</label>
          <div class="btn-group" role="group">
            <input type="radio" class="btn-check" name="type" id="type-lost" value="LOST" checked>
            <label class="btn btn-outline-danger" for="type-lost">I LOST an item</label>
            <input type="radio" class="btn-check" name="type" id="type-found" value="FOUND">
            <label class="btn btn-outline-success" for="type-found">I FOUND an item</label>
          </div>
        </div>
        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label">Item title</label>
            <input type="text" id="title" class="form-control" placeholder="e.g. Black leather wallet" required>
          </div>
          <div class="col-md-3 mb-3">
            <label class="form-label">Category</label>
            <select id="category" class="form-select"></select>
          </div>
          <div class="col-md-3 mb-3">
            <label class="form-label">Location</label>
            <select id="location" class="form-select"></select>
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label">Description</label>
          <textarea id="description" class="form-control" rows="3"
            placeholder="Colour, brand, unique marks, contents - anything that helps identify it" required></textarea>
        </div>
        <div class="mb-3">
          <label class="form-label">Photo of the item (helps image matching)</label>
          <input type="file" id="image" class="form-control" accept="image/*">
          <img id="preview" class="mt-2 rounded d-none" style="max-height:180px" alt="preview">
        </div>
        <button type="submit" class="btn btn-brand">Submit report</button>
      </form>
    </div>
  </div>
  <div id="result" class="mt-4"></div>
</div>

<div id="app-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/app.js"></script>
<script>
(async () => {
  await renderNavbar("report");
  pageFooter();
  if (!requireAuth()) return;

  document.getElementById("category").innerHTML = CATEGORIES.map(c => `<option>${c}</option>`).join("");
  document.getElementById("location").innerHTML = LOCATIONS.map(l => `<option>${l}</option>`).join("");

  document.getElementById("image").addEventListener("change", (e) => {
    const f = e.target.files[0];
    const img = document.getElementById("preview");
    if (f) { img.src = URL.createObjectURL(f); img.classList.remove("d-none"); }
  });

  document.getElementById("report-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const msg = document.getElementById("msg");
    const fd = new FormData();
    fd.append("title", document.getElementById("title").value);
    fd.append("type", document.querySelector("input[name=type]:checked").value);
    fd.append("category", document.getElementById("category").value);
    fd.append("description", document.getElementById("description").value);
    fd.append("location", document.getElementById("location").value);
    const file = document.getElementById("image").files[0];
    if (file) fd.append("image", file);
    try {
      const res = await fetch("/api/items", { method: "POST", body: fd });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Could not submit the report");
      document.getElementById("result").innerHTML = `
        <div class="alert alert-success">
          <strong>Report submitted!</strong> Your ${esc(data.type)} report "${esc(data.title)}" is now live.
          <a href="/item.html?id=${data.itemId}" class="alert-link">View it and see match suggestions</a>
        </div>`;
      e.target.reset();
      document.getElementById("preview").classList.add("d-none");
      window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
    } catch (err) {
      msg.innerHTML = `<div class="alert alert-danger">${esc(err.message)}</div>`;
    }
  });
})();
</script>
</body>
</html>
