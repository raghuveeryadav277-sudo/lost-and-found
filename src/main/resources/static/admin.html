<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin - Lost &amp; Found</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="/css/app.css" rel="stylesheet">
</head>
<body>
<div id="app-navbar"></div>

<div class="container mt-4">
  <h2 class="mb-3">Admin - all cases</h2>
  <div id="msg"></div>

  <h4>All item reports (audit)</h4>
  <div class="table-responsive mb-5">
    <table class="table table-striped table-sm align-middle">
      <thead><tr><th>#</th><th>Title</th><th>Type</th><th>Category</th><th>Location</th><th>Status</th><th>Reported by</th><th>Date</th><th></th></tr></thead>
      <tbody id="items-body"><tr><td colspan="9" class="text-muted">Loading...</td></tr></tbody>
    </table>
  </div>

  <h4>All claims (audit)</h4>
  <div class="table-responsive mb-5">
    <table class="table table-striped table-sm align-middle">
      <thead><tr><th>#</th><th>Item</th><th>Claimant</th><th>Status</th><th>Date</th></tr></thead>
      <tbody id="claims-body"><tr><td colspan="5" class="text-muted">Loading...</td></tr></tbody>
    </table>
  </div>

  <h4>Registered users</h4>
  <div class="table-responsive">
    <table class="table table-striped table-sm align-middle">
      <thead><tr><th>#</th><th>Name</th><th>Email</th><th>Role</th></tr></thead>
      <tbody id="users-body"><tr><td colspan="4" class="text-muted">Loading...</td></tr></tbody>
    </table>
  </div>
</div>

<div id="app-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/app.js"></script>
<script>
(async () => {
  await renderNavbar("admin");
  pageFooter();
  const msg = document.getElementById("msg");

  async function load() {
    try {
      const items = await apiGet("/api/admin/items");
      document.getElementById("items-body").innerHTML = items.map(i => `
        <tr>
          <td>${i.itemId}</td>
          <td><a href="/item.html?id=${i.itemId}">${esc(i.title)}</a></td>
          <td><span class="badge ${i.type === "LOST" ? "badge-lost" : "badge-found"}">${i.type}</span></td>
          <td>${esc(i.category)}</td><td>${esc(i.location || "-")}</td>
          <td><span class="badge badge-status-${i.status}">${i.status}</span></td>
          <td>${esc(i.reportedByName)}</td><td>${fmtDate(i.createdAt)}</td>
          <td>${i.status === "OPEN" || i.status === "CLAIMED"
            ? `<button class="btn btn-outline-secondary btn-sm close-btn" data-id="${i.itemId}">Close</button>` : ""}</td>
        </tr>`).join("") || '<tr><td colspan="9" class="text-muted">No items yet.</td></tr>';

      const claims = await apiGet("/api/admin/claims");
      document.getElementById("claims-body").innerHTML = claims.map(c => `
        <tr><td>${c.claimId}</td><td>${esc(c.itemTitle)}</td><td>${esc(c.claimantName)}</td>
            <td>${esc(c.verificationStatus)}</td><td>${fmtDate(c.timestamp)}</td></tr>`).join("")
        || '<tr><td colspan="5" class="text-muted">No claims yet.</td></tr>';

      const users = await apiGet("/api/admin/users");
      document.getElementById("users-body").innerHTML = users.map(u => `
        <tr><td>${u.userId}</td><td>${esc(u.name)}</td><td>${esc(u.email)}</td><td>${esc(u.role)}</td></tr>`).join("");

      document.querySelectorAll(".close-btn").forEach(b => b.addEventListener("click", async () => {
        if (!confirm("Close this case as admin?")) return;
        try { await apiPost("/api/admin/items/" + b.dataset.id + "/close"); load(); }
        catch (e) { msg.innerHTML = `<div class="alert alert-danger">${esc(e.message)}</div>`; }
      }));
    } catch (e) {
      msg.innerHTML = '<div class="alert alert-danger">Admin access required. Please login as admin.</div>';
    }
  }
  load();
})();
</script>
</body>
</html>
