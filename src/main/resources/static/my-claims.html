<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Claims - Lost &amp; Found</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="/css/app.css" rel="stylesheet">
</head>
<body>
<div id="app-navbar"></div>

<div class="container mt-4">
  <h2 class="mb-3">My claims</h2>
  <div id="msg"></div>

  <h4 class="mt-4">Claims I made</h4>
  <p class="text-muted">Items you claimed as yours. When a claim is approved, show its QR code at handover.</p>
  <div id="mine"><p class="text-muted">Loading...</p></div>

  <h4 class="mt-5">Claims on my items</h4>
  <p class="text-muted">People claiming items you reported. Approve only when the proof convinces you.</p>
  <div id="received"><p class="text-muted">Loading...</p></div>
</div>

<div id="app-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/app.js"></script>
<script>
(async () => {
  await renderNavbar("myclaims");
  pageFooter();
  if (!requireAuth()) return;
  const msg = document.getElementById("msg");

  const statusBadge = (s) => ({
    PENDING: '<span class="badge bg-warning text-dark">PENDING</span>',
    APPROVED: '<span class="badge bg-primary">APPROVED</span>',
    REJECTED: '<span class="badge bg-danger">REJECTED</span>',
    VERIFIED: '<span class="badge bg-success">VERIFIED - RETURNED</span>'
  }[s] || s);

  function claimRow(c, actionsHtml, qrHtml) {
    return `
    <div class="card mb-3 shadow-sm">
      <div class="card-body d-flex flex-wrap gap-3 align-items-start">
        ${c.itemImage ? `<img src="${esc(c.itemImage)}" style="width:90px;height:90px;object-fit:cover" class="rounded" alt="">` : ""}
        <div class="flex-grow-1">
          <strong><a href="/item.html?id=${c.itemId}">${esc(c.itemTitle)}</a></strong> ${statusBadge(c.verificationStatus)}
          <div class="text-muted" style="font-size:.9rem">Claim by ${esc(c.claimantName)} &middot; ${fmtDate(c.timestamp)}</div>
          <div class="mt-1"><em>Proof:</em> ${esc(c.proofNote || "-")}</div>
          ${c.verificationStatus === "APPROVED" && c.verificationToken
            ? `<div class="mt-1">Verification code: <code>${esc(c.verificationToken)}</code></div>` : ""}
          <div class="mt-2">${actionsHtml}</div>
        </div>
        ${qrHtml}
      </div>
    </div>`;
  }

  async function load() {
    const mine = await apiGet("/api/claims/mine");
    document.getElementById("mine").innerHTML = mine.length
      ? mine.map(c => claimRow(c, "",
          c.verificationStatus === "APPROVED"
            ? `<img class="qr-img" src="/api/claims/${c.claimId}/qr" alt="QR code">` : "")).join("")
      : '<p class="text-muted">You have not claimed any item yet.</p>';

    const received = await apiGet("/api/claims/received");
    document.getElementById("received").innerHTML = received.length
      ? received.map(c => claimRow(c,
          c.verificationStatus === "PENDING"
            ? `<button class="btn btn-success btn-sm approve-btn" data-id="${c.claimId}">Approve</button>
               <button class="btn btn-outline-danger btn-sm reject-btn" data-id="${c.claimId}">Reject</button>`
            : (c.verificationStatus === "APPROVED"
               ? `<a class="btn btn-brand btn-sm" href="/verify.html?token=${encodeURIComponent(c.verificationToken)}">Verify handover</a>` : ""),
          c.verificationStatus === "APPROVED"
            ? `<img class="qr-img" src="/api/claims/${c.claimId}/qr" alt="QR code">` : "")).join("")
      : '<p class="text-muted">No claims on your items yet.</p>';

    document.querySelectorAll(".approve-btn").forEach(b => b.addEventListener("click", async () => {
      try { await apiPost("/api/claims/" + b.dataset.id + "/approve");
        msg.innerHTML = '<div class="alert alert-success">Claim approved. A QR verification code has been generated.</div>'; load(); }
      catch (e) { msg.innerHTML = `<div class="alert alert-danger">${esc(e.message)}</div>`; }
    }));
    document.querySelectorAll(".reject-btn").forEach(b => b.addEventListener("click", async () => {
      if (!confirm("Reject this claim?")) return;
      try { await apiPost("/api/claims/" + b.dataset.id + "/reject");
        msg.innerHTML = '<div class="alert alert-secondary">Claim rejected.</div>'; load(); }
      catch (e) { msg.innerHTML = `<div class="alert alert-danger">${esc(e.message)}</div>`; }
    }));
  }
  load();
})();
</script>
</body>
</html>
