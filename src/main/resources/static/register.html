<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Register - Lost &amp; Found</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="/css/app.css" rel="stylesheet">
</head>
<body>
<div id="app-navbar"></div>

<div class="container">
  <div class="card auth-card shadow-sm">
    <div class="card-body p-4">
      <h3 class="card-title text-center mb-1">Create your account</h3>
      <p class="text-center text-muted mb-4">Use your campus email to register</p>
      <div id="msg"></div>
      <form id="register-form">
        <div class="mb-3">
          <label class="form-label">Full name</label>
          <input type="text" id="name" class="form-control" placeholder="Your name" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" id="email" class="form-control" placeholder="you@campus.edu" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" id="password" class="form-control" placeholder="At least 6 characters" required minlength="6">
        </div>
        <button type="submit" class="btn btn-brand w-100">Register</button>
      </form>
      <p class="text-center mt-3 mb-0">Already registered? <a href="/login.html">Login</a></p>
    </div>
  </div>
</div>

<div id="app-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/app.js"></script>
<script>
(async () => {
  await renderNavbar("");
  pageFooter();
  document.getElementById("register-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const msg = document.getElementById("msg");
    try {
      await apiPost("/api/auth/register", {
        name: document.getElementById("name").value,
        email: document.getElementById("email").value,
        password: document.getElementById("password").value
      });
      msg.innerHTML = '<div class="alert alert-success">Account created! Redirecting to login...</div>';
      setTimeout(() => location.href = "/login.html", 900);
    } catch (err) {
      msg.innerHTML = `<div class="alert alert-danger">${esc(err.message)}</div>`;
    }
  });
})();
</script>
</body>
</html>
