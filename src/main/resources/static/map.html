<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Campus Map - Lost &amp; Found</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="/css/app.css" rel="stylesheet">
</head>
<body>
<div id="app-navbar"></div>

<div class="container mt-4">
  <h2 class="mb-1">Smart campus map</h2>
  <p class="text-muted">Pins show where open reports were lost or found. Click a pin to see the items at that place.
    <span class="badge badge-found">FOUND</span> <span class="badge badge-lost">LOST</span></p>

  <div class="card shadow-sm">
    <div class="card-body text-center">
      <svg id="campus-map" viewBox="0 0 800 540" style="max-width:820px;width:100%;background:#eaf3e4;border-radius:12px">
        <!-- roads -->
        <rect x="392" y="0" width="16" height="540" fill="#cfd4d8"/>
        <rect x="0" y="252" width="800" height="16" fill="#cfd4d8"/>
        <!-- buildings -->
        <g font-family="Segoe UI, sans-serif" font-size="15" fill="#14406b" text-anchor="middle">
          <rect x="330" y="30" width="140" height="66" rx="8" fill="#bcd3ea"/><text x="400" y="68">Admin Block</text>
          <rect x="55" y="80" width="160" height="95" rx="8" fill="#bcd3ea"/><text x="135" y="132">Library</text>
          <rect x="585" y="80" width="160" height="95" rx="8" fill="#bcd3ea"/><text x="665" y="132">Canteen</text>
          <rect x="55" y="330" width="160" height="95" rx="8" fill="#bcd3ea"/><text x="135" y="382">Lab Block</text>
          <rect x="585" y="330" width="160" height="95" rx="8" fill="#bcd3ea"/><text x="665" y="382">Hostel</text>
          <rect x="243" y="165" width="115" height="58" rx="8" fill="#d7e5f3"/><text x="300" y="199" font-size="13">Auditorium</text>
          <rect x="442" y="165" width="115" height="58" rx="8" fill="#d7e5f3"/><text x="499" y="199" font-size="13">Parking</text>
          <ellipse cx="400" cy="345" rx="125" ry="72" fill="#bfe3c0"/><text x="400" y="350">Playground</text>
          <rect x="322" y="478" width="156" height="42" rx="8" fill="#f2d8a7"/><text x="400" y="504">Main Gate</text>
        </g>
        <g id="pins"></g>
      </svg>
    </div>
  </div>

  <h4 class="mt-4" id="pin-title">Items on the map</h4>
  <div class="row" id="pin-items"><p class="text-muted">Loading...</p></div>
</div>

<div id="app-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/app.js"></script>
<script>
(async () => {
  await renderNavbar("map");
  pageFooter();

  // Anchor point (x, y) for each known campus location.
  const ANCHORS = {
    "Admin Block": [400, 112], "Library": [135, 192], "Canteen": [665, 192],
    "Lab Block": [135, 313], "Hostel": [665, 313], "Auditorium": [300, 238],
    "Parking": [499, 238], "Playground": [400, 432], "Main Gate": [400, 462]
  };

  const items = await apiGet("/api/items?status=OPEN");
  const pins = document.getElementById("pins");
  const byLocation = {};
  items.forEach(i => { (byLocation[i.location] = byLocation[i.location] || []).push(i); });

  Object.entries(byLocation).forEach(([loc, list]) => {
    const anchor = ANCHORS[loc] || [400, 432];
    list.forEach((item, idx) => {
      const jx = ((idx % 3) - 1) * 16, jy = Math.floor(idx / 3) * 16;
      const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
      g.setAttribute("class", "map-pin");
      g.innerHTML = `<circle cx="${anchor[0] + jx}" cy="${anchor[1] + jy}" r="10"
          fill="${item.type === "FOUND" ? "#1e8449" : "#c0392b"}" stroke="#fff" stroke-width="2"/>
        <text x="${anchor[0] + jx}" y="${anchor[1] + jy + 4}" font-size="11" fill="#fff"
          text-anchor="middle" font-weight="bold">${item.type === "FOUND" ? "F" : "L"}</text>`;
      g.addEventListener("click", () => showItems(loc, list));
      pins.appendChild(g);
    });
  });

  function showItems(loc, list) {
    document.getElementById("pin-title").textContent = `Items at ${loc} (${list.length})`;
    document.getElementById("pin-items").innerHTML = list.map(i => itemCard(i)).join("");
    document.getElementById("pin-items").scrollIntoView({ behavior: "smooth" });
  }

  document.getElementById("pin-items").innerHTML =
    items.map(i => itemCard(i)).join("") || '<p class="text-muted">No open reports to show on the map.</p>';
})();
</script>
</body>
</html>
