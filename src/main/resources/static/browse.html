<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Browse &amp; Search - Lost &amp; Found</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="/css/app.css" rel="stylesheet">
</head>
<body>
<div id="app-navbar"></div>

<div class="container mt-4">
  <h2 class="mb-3">Browse &amp; search reports</h2>
  <div class="card shadow-sm mb-4">
    <div class="card-body">
      <form id="filter-form" class="row g-2">
        <div class="col-md-2">
          <select id="f-type" class="form-select">
            <option value="">Lost + Found</option><option value="LOST">Lost only</option><option value="FOUND">Found only</option>
          </select>
        </div>
        <div class="col-md-2"><select id="f-category" class="form-select"><option value="">All categories</option></select></div>
        <div class="col-md-2"><select id="f-location" class="form-select"><option value="">All locations</option></select></div>
        <div class="col-md-2">
          <select id="f-status" class="form-select">
            <option value="OPEN">Open</option><option value="">Any status</option>
            <option value="CLAIMED">Claimed</option><option value="RETURNED">Returned</option><option value="CLOSED">Closed</option>
          </select>
        </div>
        <div class="col-md-3"><input id="f-keyword" class="form-control" placeholder="Keyword (title or description)"></div>
        <div class="col-md-1"><button class="btn btn-brand w-100" type="submit">Search</button></div>
      </form>
    </div>
  </div>
  <p class="text-muted" id="count-line"></p>
  <div class="row" id="results"><p class="text-muted">Loading...</p></div>
</div>

<div id="app-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/app.js"></script>
<script>
(async () => {
  await renderNavbar("browse");
  pageFooter();
  document.getElementById("f-category").innerHTML += CATEGORIES.map(c => `<option>${c}</option>`).join("");
  document.getElementById("f-location").innerHTML += LOCATIONS.map(l => `<option>${l}</option>`).join("");

  async function load() {
    const params = new URLSearchParams();
    const t = document.getElementById("f-type").value; if (t) params.set("type", t);
    const c = document.getElementById("f-category").value; if (c) params.set("category", c);
    const l = document.getElementById("f-location").value; if (l) params.set("location", l);
    const s = document.getElementById("f-status").value; if (s) params.set("status", s);
    const k = document.getElementById("f-keyword").value.trim(); if (k) params.set("keyword", k);
    try {
      const items = await apiGet("/api/items?" + params.toString());
      document.getElementById("count-line").textContent = items.length + " report(s) found";
      document.getElementById("results").innerHTML =
        items.map(i => itemCard(i)).join("") || '<p class="text-muted">No reports match your search.</p>';
    } catch (e) {
      document.getElementById("results").innerHTML = '<p class="text-danger">Could not load reports.</p>';
    }
  }
  document.getElementById("filter-form").addEventListener("submit", (e) => { e.preventDefault(); load(); });
  ["f-type", "f-category", "f-location", "f-status"].forEach(id =>
    document.getElementById(id).addEventListener("change", load));
  load();
})();
</script>
</body>
</html>
